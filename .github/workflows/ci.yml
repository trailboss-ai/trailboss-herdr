name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod's pure logic; diff.test applies hunk patches with real git.
      - run: for t in mods/trailboss/*.test.mjs mods/trailboss/*/*.test.mjs; do node "$t"; done
      - run: python3 test_setup_mod.py
      - run: python3 test_install.py
